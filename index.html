<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0,
      maximum-scale=1.0,user-scalable=no">

<title>MINH ANH UI</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    width:100%;
    min-height:100%;
}

body{
    background:
        radial-gradient(
            circle at 50% 42%,
            rgba(255,0,65,.13),
            transparent 38%
        ),
        #020202;
    color:white;
    font-family:Arial,Helvetica,sans-serif;
    overflow-x:hidden;
}

/* ===== CONTAINER ===== */
.wrapper{
    width:100%;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:25px;
}

.login-box{
    width:100%;
    max-width:730px;
    min-height:850px;

    padding:70px 52px 55px;

    border:1px solid rgba(255,25,85,.65);
    border-radius:55px;

    background:
        linear-gradient(
            145deg,
            rgba(16,16,21,.96),
            rgba(3,3,6,.98)
        );

    box-shadow:
        0 0 35px rgba(255,0,70,.08),
        inset 0 0 35px rgba(255,0,70,.025);

    display:flex;
    flex-direction:column;
    align-items:center;
}

/* ===== AVATAR ===== */
.avatar{
    width:145px;
    height:145px;
    border-radius:42px;

    border:2px solid #ff174f;

    display:flex;
    align-items:center;
    justify-content:center;

    overflow:hidden;

    background:
        radial-gradient(
            circle,
            #666,
            #111 65%
        );

    box-shadow:
        0 0 15px rgba(255,20,80,.7),
        0 0 45px rgba(255,0,65,.3);
}

.avatar span{
    font-size:58px;
    filter:grayscale(1);
}

/* ===== TITLE ===== */
.title{
    margin-top:48px;
    font-size:42px;
    font-weight:900;
    letter-spacing:1px;
    text-align:center;
}

.title .pink{
    color:#ff174f;
}

.subtitle{
    margin-top:24px;
    color:#9298aa;
    font-size:25px;
    font-weight:700;
    letter-spacing:.5px;
    text-align:center;
}

/* ===== INPUT ===== */
.key-area{
    width:100%;
    margin-top:55px;
}

.key-input{
    width:100%;
    height:100px;

    border-radius:30px;
    border:2px solid #292a31;

    background:#101014;

    color:white;
    outline:none;

    padding:0 30px;

    font-size:26px;
    text-align:center;
    font-weight:700;

    transition:.25s;
}

.key-input:focus{
    border-color:#ff174f;

    box-shadow:
        0 0 15px rgba(255,23,79,.25),
        0 0 35px rgba(255,23,79,.12);
}

.key-input::placeholder{
    color:transparent;
}

/* ===== LOGIN BUTTON ===== */
.login-btn{
    width:100%;
    height:105px;

    margin-top:80px;

    border:none;
    border-radius:30px;

    background:
        linear-gradient(
            100deg,
            #ff164d,
            #ff2870
        );

    color:white;

    font-size:28px;
    font-weight:900;
    letter-spacing:3px;

    cursor:pointer;

    box-shadow:
        0 8px 30px rgba(255,0,70,.25);

    transition:.2s;
}

.login-btn:active{
    transform:scale(.97);

    box-shadow:
        0 3px 15px rgba(255,0,70,.3);
}

/* ===== STATUS ===== */
.status{
    margin-top:42px;

    display:flex;
    align-items:center;
    justify-content:center;

    gap:18px;

    color:#969baa;

    font-size:23px;
    font-weight:800;
    letter-spacing:2px;
}

.status-dot{
    width:20px;
    height:20px;

    background:#ff174f;
    border-radius:50%;

    box-shadow:
        0 0 12px #ff174f,
        0 0 25px rgba(255,23,79,.5);
}

/* ===== MESSAGE ===== */
.message{
    min-height:32px;
    margin-top:22px;

    font-size:18px;
    font-weight:700;
    text-align:center;
}

.success{
    color:#55ff91;
}

.error{
    color:#ff3d68;
}

/* ===== ZALO ===== */
.zalo{
    position:fixed;

    right:30px;
    bottom:35px;

    width:120px;
    height:120px;

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            #fff 0 45%,
            #1877f2 47% 54%,
            #06234f 58% 100%
        );

    display:flex;
    align-items:center;
    justify-content:center;

    text-decoration:none;

    box-shadow:
        0 0 15px rgba(0,110,255,.65),
        0 0 45px rgba(0,100,255,.25);

    transition:.2s;
}

.zalo span{
    color:#1672d4;
    font-size:25px;
    font-weight:900;
}

.zalo:active{
    transform:scale(.9);
}

/* ===== MOBILE ===== */
@media(max-width:600px){

    .wrapper{
        padding:25px 15px;
    }

    .login-box{
        min-height:auto;

        padding:
            70px 50px
            55px;

        border-radius:45px;
    }

    .avatar{
        width:145px;
        height:145px;
    }

    .title{
        font-size:40px;
        white-space:nowrap;
    }

    .subtitle{
        font-size:23px;
        white-space:nowrap;
    }

    .key-input{
        height:95px;
    }

    .login-btn{
        height:105px;
        margin-top:80px;
    }

    .zalo{
        width:95px;
        height:95px;
        right:18px;
        bottom:22px;
    }
}

@media(max-width:400px){

    .login-box{
        padding-left:25px;
        padding-right:25px;
    }

    .title{
        font-size:32px;
    }

    .subtitle{
        font-size:18px;
    }

    .login-btn{
        font-size:22px;
    }
}
</style>
</head>

<body>

<div class="wrapper">

    <div class="login-box">

        <!-- AVATAR -->
        <div class="avatar">
            <span>♟</span>
        </div>

        <!-- TITLE -->
        <div class="title">
            MINH ANH <span class="pink">UI</span>
        </div>

        <div class="subtitle">
            Nhập key để truy cập hệ thống
        </div>

        <!-- KEY -->
        <div class="key-area">

            <input
                id="keyInput"
                class="key-input"
                type="password"
                autocomplete="off"
                placeholder="Nhập key"
            >

        </div>

        <!-- LOGIN -->
        <button
            class="login-btn"
            onclick="login()">
            ĐĂNG NHẬP
        </button>

        <!-- STATUS -->
        <div class="status">
            <span class="status-dot"></span>
            <span>HỆ THỐNG SẴN SÀNG</span>
        </div>

        <div id="message" class="message"></div>

    </div>
</div>

<!-- ZALO -->
<a
    class="zalo"
    href="https://zaloapp.com/qr/p/p8l5wrhi61qu?src=qr"
    target="_blank"
>
    <span>Zalo</span>
</a>

<script>

/* =========================
   KEY HỆ THỐNG
   ========================= */

const SYSTEM_KEY = "hkhoi";

function login(){

    const input =
        document.getElementById("keyInput");

    const message =
        document.getElementById("message");

    const key =
        input.value.trim();

    if(key === SYSTEM_KEY){

        message.className =
            "message success";

        message.innerHTML =
            "✓ Đăng nhập thành công";

        // Chuyển sang trang chính
        setTimeout(() => {

            document.body.innerHTML = `
                <div style="
                    min-height:100vh;
                    background:#020202;
                    color:white;
                    display:flex;
                    align-items:center;
                    justify-content:center;
                    font-family:Arial;
                    text-align:center;
                    padding:30px;
                ">
                    <div>
                        <h1 style="
                            font-size:42px;
                            color:#ff174f;
                            margin-bottom:20px;
                        ">
                            MINH ANH UI
                        </h1>

                        <p style="
                            color:#aaa;
                            font-size:20px;
                        ">
                            Chào mừng bạn, hkhoi 🚀
                        </p>
                    </div>
                </div>
            `;

        },800);

    }else{

        message.className =
            "message error";

        message.innerHTML =
            "✕ Key không chính xác";

        input.value = "";

    }
}

/* Nhấn Enter để đăng nhập */
document
    .getElementById("keyInput")
    .addEventListener("keydown", function(e){

        if(e.key === "Enter"){
            login();
        }

    });

</script>

</body>
</html>
